<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Guess Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .word-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 50px;
            height: 60px;
            background: #f0f0f0;
            border: 2px solid #667eea;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
        }

        .letter-box.filled {
            background: #667eea;
            color: white;
            transform: scale(1.1);
        }

        .attempts-display {
            background: #f8f9fa;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
        }

        .attempts-display span {
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
        }

        .input-section {
            margin: 30px 0;
        }

        #guessInput {
            width: 250px;
            padding: 15px 20px;
            font-size: 1.2em;
            border: 2px solid #667eea;
            border-radius: 10px;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        #guessInput:focus {
            border-color: #764ba2;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .guess-btn {
            background: #667eea;
            color: white;
        }

        .guess-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .new-game-btn {
            background: #28a745;
            color: white;
        }

        .new-game-btn:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }

        .message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .message.info {
            background: #e7f3ff;
            color: #0066cc;
        }

        .hidden {
            display: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .pop {
            animation: pop 0.3s;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Word Guess</h1>
        <p class="subtitle">Guess the hidden word in 5 attempts!</p>

        <div class="word-display" id="wordDisplay"></div>

        <div class="attempts-display">
            Attempts left: <span id="attemptsLeft">5</span>
        </div>

        <div class="input-section">
            <input 
                type="text" 
                id="guessInput" 
                placeholder="Enter your guess" 
                maxlength="20"
                autocomplete="off"
            >
        </div>

        <button class="btn guess-btn" id="guessBtn">Guess Word</button>
        <button class="btn new-game-btn hidden" id="newGameBtn">New Game</button>

        <div class="message info" id="message">
            Welcome! Start by guessing the word.
        </div>
    </div>

    <script>
        const wordBank = ['hello', 'bye', 'welcome', 'funny', 'rhythm'];
        
        let word = '';
        let wordLength = 0;
        let attempts = 5;
        let gameActive = true;

        const wordDisplay = document.getElementById('wordDisplay');
        const attemptsLeft = document.getElementById('attemptsLeft');
        const guessInput = document.getElementById('guessInput');
        const guessBtn = document.getElementById('guessBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const message = document.getElementById('message');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
        }

        function createWordDisplay() {
            wordDisplay.innerHTML = '';
            for (let i = 0; i < wordLength; i++) {
                const letterBox = document.createElement('div');
                letterBox.className = 'letter-box';
                letterBox.textContent = '_';
                wordDisplay.appendChild(letterBox);
            }
        }

        function updateWordDisplay(guessedWord) {
            const letterBoxes = wordDisplay.querySelectorAll('.letter-box');
            for (let i = 0; i < wordLength; i++) {
                if (guessedWord.toLowerCase() === word.toLowerCase()) {
                    letterBoxes[i].textContent = word[i];
                    letterBoxes[i].classList.add('filled');
                    letterBoxes[i].classList.add('pop');
                }
            }
        }

        function startNewGame() {
            word = wordBank[Math.floor(Math.random() * wordBank.length)];
            wordLength = word.length;
            attempts = 5;
            gameActive = true;

            createWordDisplay();
            attemptsLeft.textContent = attempts;
            guessInput.value = '';
            guessInput.disabled = false;
            guessBtn.classList.remove('hidden');
            newGameBtn.classList.add('hidden');
            
            showMessage('New word chosen! You have ' + attempts + ' attempts to guess it.', 'info');
        }

        function handleGuess() {
            if (!gameActive) return;

            const guess = guessInput.value.trim().toLowerCase();

            if (!guess || !guess.match(/^[a-zA-Z]+$/)) {
                showMessage('Please enter only letters.', 'error');
                guessInput.classList.add('shake');
                setTimeout(() => guessInput.classList.remove('shake'), 500);
                return;
            }

            if (guess === word) {
                updateWordDisplay(guess);
                showMessage('Congratulations! You guessed the word: ' + word, 'success');
                gameActive = false;
                guessInput.disabled = true;
                guessBtn.classList.add('hidden');
                newGameBtn.classList.remove('hidden');
            } else {
                attempts--;
                attemptsLeft.textContent = attempts;
                showMessage('Wrong! Attempts left: ' + attempts, 'error');
                
                if (attempts === 0) {
                    gameActive = false;
                    guessInput.disabled = true;
                    guessBtn.classList.add('hidden');
                    newGameBtn.classList.remove('hidden');
                    
                    // Show the actual word
                    const letterBoxes = wordDisplay.querySelectorAll('.letter-box');
                    for (let i = 0; i < wordLength; i++) {
                        letterBoxes[i].textContent = word[i];
                        letterBoxes[i].classList.add('filled');
                    }
                    
                    showMessage('Game Over! The word was: ' + word, 'error');
                }
            }

            guessInput.value = '';
        }

        // Event listeners
        guessBtn.addEventListener('click', handleGuess);
        
        guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleGuess();
            }
        });

        newGameBtn.addEventListener('click', startNewGame);

        // Start the game
        startNewGame();
    </script>
</body>
</html>
